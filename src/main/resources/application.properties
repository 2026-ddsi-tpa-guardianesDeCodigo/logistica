# ==============================
# BASE DE DATOS (PostgreSQL)
# Reemplazar con la URL de Render cuando esté deployado
# ==============================
spring.datasource.url=jdbc:${DB_URL:h2:mem:logistica_db}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

donaciones.url=${DONACIONES_URL:http://localhost:8083}
donadores.url=${DONADORES_URL:http://localhost:8081}

# JPA/Hibernate Configuration
# show-sql imprime SQL multilinea a stdout, fuera del formato de logging: en Render con LOG_FORMAT=ecs
# rompe el contrato "una linea JSON por evento". Solo a demanda (SHOW_SQL=true).
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update

# ==============================
# MÉTRICAS - Actuator
# ==============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ==============================
# MÉTRICAS - Datadog
# ==============================
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.step=30s
management.metrics.tags.application=logistica
management.metrics.tags.env=production

# ==============================
# MENSAJERIA - RabbitMQ (CloudAMQP)
# QUEUE_URL es la URI de conexion completa tal cual la da CloudAMQP
# (amqps://usuario:password@host/vhost). No existe spring.rabbitmq.uri en esta
# version de Spring Boot: la propiedad real es "addresses", que acepta el mismo
# formato URI por entrada y activa TLS solo cuando detecta el prefijo "amqps://"
# (Spring Boot le pega una sola URL a un List<String> sin problema).
# Sin la env var, apunta a un RabbitMQ local sin TLS.
# ==============================
spring.rabbitmq.addresses=${QUEUE_URL:amqp://guest:guest@localhost:5672/}
logistica.queue.donaciones=${QUEUE_NAME:donaciones-pendientes}

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.add-properties=false

# Server Configuration

server.port=8084

# ==============================
# LOGGING - ECS (docs/logging-spec_v1.md del repo de Donadores)
# LOG_FORMAT vacio => consola legible (local); "ecs" en Render.
# ==============================
logging.structured.format.console=${LOG_FORMAT:}
logging.structured.ecs.service.name=${SERVICE_NAME:logistica}
logging.structured.ecs.service.version=${SERVICE_VERSION:dev}
logging.structured.ecs.service.environment=${APP_ENV:local}
logging.level.root=INFO
logging.level.ar.edu.utn.dds.k3003=INFO
# SQL de Hibernate solo a demanda (SQL_LOG_LEVEL=DEBUG).
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

# Consola legible (solo aplica sin LOG_FORMAT; con ecs se ignora): %kvp agrega los campos de cada evento.
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-28.28logger{27}){cyan} %clr(:){faint} %m %kvp %clr([%X{trace.id:-}]){faint}%n%wEx
